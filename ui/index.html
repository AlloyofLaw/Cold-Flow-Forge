<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>JARVIS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot" id="status-dot"></span>
          <span class="brand-name">JARVIS</span>
        </div>
        <div class="status-line" id="status-line">Starting…</div>
      </header>

      <main class="layout">
        <section class="panel conversation-panel">
          <h2>Conversation</h2>
          <div class="conversation" id="conversation"></div>
          <form id="message-form" class="message-form">
            <input
              id="message-input"
              type="text"
              placeholder="Type a message to JARVIS…"
              autocomplete="off"
            />
            <button type="submit">Send</button>
          </form>
        </section>

        <aside class="panel sidebar">
          <div class="sidebar-section">
            <h2>Status</h2>
            <dl class="status-grid" id="status-grid">
              <dt>Voice</dt>
              <dd id="status-voice">-</dd>
              <dt>Brain</dt>
              <dd id="status-brain">-</dd>
              <dt>Cost today</dt>
              <dd id="status-cost-today">-</dd>
              <dt>Cost this month</dt>
              <dd id="status-cost-month">-</dd>
              <dt>Budget cap</dt>
              <dd id="status-budget">-</dd>
            </dl>
          </div>

          <div class="sidebar-section">
            <h2>Activity Log</h2>
            <div class="activity-log" id="activity-log"></div>
          </div>

          <div class="sidebar-section">
            <h2>Settings</h2>
            <p class="settings-stub">
              Settings panel coming in a later phase. Edit <code>.env</code>
              (copied from <code>.env.example</code>) to configure JARVIS.
            </p>
          </div>
        </aside>
      </main>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
